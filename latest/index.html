<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f7d7d">
  <title>Opening the latest YMCA Timetable…</title>
  <link rel="canonical" href="https://garettwong.github.io/ymca-timetable/latest/">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef1f6;color:#1d2734;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:430px;width:100%;padding:24px;border:1px solid #d8e0ec;border-radius:16px;background:#fff;box-shadow:0 4px 18px rgba(20,30,50,.08);text-align:center}.brand{color:#0f7d7d;font-weight:850}.status{margin-top:8px;color:#64707f}.fallback{display:inline-block;margin-top:16px;color:#0f6f73;font-weight:750}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div><span class="brand">YMCA</span> Tutoring Timetable</div>
    <div class="status" id="status">Checking the newest published version…</div>
    <a class="fallback" id="fallback" href="../v6.html?version=v6&amp;release=20260825-v6">Open V6 if this page does not continue</a>
  </main>
  <script>
  (function(){
    var status=document.getElementById('status');
    var jsonURL=new URL('../latest.json',location.href);jsonURL.searchParams.set('_',Date.now());
    function loadTarget(data){
      if(!data||!/^v\d+$/.test(data.version||'')||!/^v\d+\.html$/.test(data.path||''))throw new Error('Invalid latest release data');
      var target=new URL('../'+data.path,location.href);
      target.searchParams.set('_',Date.now());
      return fetch(target.href,{cache:'no-store',headers:{'Cache-Control':'no-cache'}})
        .then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.text();})
        .then(function(html){
          if(!/<head(?:\s[^>]*)?>/i.test(html)||!/<\/html>/i.test(html))throw new Error('Invalid timetable document');
          var baseURL=new URL('../',location.href).href.replace(/"/g,'&quot;');
          html=html.replace(/<head(\s[^>]*)?>/i,function(match,attrs){return '<head'+(attrs||'')+'><base href="'+baseURL+'">';});
          document.open();
          document.write(html);
          document.close();
        });
    }
    fetch(jsonURL.href,{cache:'no-store',headers:{'Cache-Control':'no-cache'}})
      .then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json();})
      .then(loadTarget)
      .catch(function(){status.textContent='The newest-version check could not finish. Use the V6 link below and try again later.';});
  })();
  </script>
  <noscript><p><a href="../v6.html?version=v6&amp;release=20260825-v6">Open YMCA Timetable V6</a></p></noscript>
</body>
</html>
