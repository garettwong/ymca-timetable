<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f7d7d">
  <title>Opening the latest YMCA Timetable…</title>
  <link rel="canonical" href="https://garettwong.github.io/ymca-timetable/latest/">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef1f6;color:#1d2734;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:430px;width:100%;padding:24px;border:1px solid #d8e0ec;border-radius:16px;background:#fff;box-shadow:0 4px 18px rgba(20,30,50,.08);text-align:center}.brand{color:#0f7d7d;font-weight:850}.status{margin-top:8px;color:#64707f}.fallback{display:inline-block;margin-top:16px;color:#0f6f73;font-weight:750}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div><span class="brand">YMCA</span> Tutoring Timetable</div>
    <div class="status" id="status">Opening the permanent latest timetable…</div>
    <a class="fallback" id="fallback" href="latest/">Open the always-current timetable</a>
  </main>
  <script>
  (function(){
    var target=new URL('latest/',location.href);
    target.search=location.search;
    target.hash=location.hash;
    location.replace(target.href);
  })();
  </script>
  <noscript><p><a href="latest/">Open the always-current YMCA Timetable</a></p></noscript>
</body>
</html>
